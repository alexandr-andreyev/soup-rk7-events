# Configuration for soup-rk7-events service

server:
  # Port to listen on for incoming RK7 events
  port: ":7080"
  # HTTP server timeouts in seconds
  read_timeout: 10
  write_timeout: 10

subscribers:
  - name: "Service1"
    url: "http://localhost:8001/webhook"
    enabled: true
    # HTTP client timeout in seconds
    timeout: 5
    # Number of retry attempts on failure
    retry_count: 3
    # Delay between retries in seconds
    retry_delay_seconds: 1
    # Filter events by table codes and event types
    table_codes:
      - 9911
      - 9922
    event_types:
    # events from Rk7Notify WSA
      - "OrderChanged"
      - "OrderStatusChanged"
      - "StopListChanged"
    
  - name: "Service2"
    url: "https://api.example.com/callback"
    enabled: true
    event_types:
      - "OrderStatusChanged"
    headers:
      Authorization: "Bearer token123"
      
  - name: "Service3"
    url: "https://api.example.com/all"
    enabled: true
    # без event_types = получает все события

database:
  # SQLite database file path for order state tracking
  path: "events.db"

logging:
  # Directory for log files
  directory: "logs"
